name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (offline, no API keys)
        run: pytest -q

      - name: Smoke-test the CLI
        run: |
          hh list
          hh detect \
            --answer "The Eiffel Tower is in Paris. It was built in 1750." \
            --context "The Eiffel Tower was completed in Paris in 1889." \
            --format json
          hh eval --dataset data/groundedness_eval.jsonl --detector groundedness --format json
