[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hallucination-hunter"
version = "0.1.0"
description = "A runnable harness for detecting and evaluating hallucinations in LLM output."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "ramenprotokol", email = "287906507+ramenprotokol@users.noreply.github.com" }]
keywords = ["llm", "evaluation", "hallucination", "groundedness", "ai-safety", "eval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core engine, the lexical detector, the mock model, metrics, and the CLI
# depend on NOTHING but the standard library. That is deliberate: anyone can
# clone this repo and run `hh eval` (and the full test suite) with zero API keys
# and zero third-party installs. The LLM backends are optional extras below.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.40"]
all = ["anthropic>=0.39", "openai>=1.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
hh = "hh.cli:main"

[project.urls]
Homepage = "https://github.com/ramenprotokol/hallucination-hunter"
Repository = "https://github.com/ramenprotokol/hallucination-hunter"
Issues = "https://github.com/ramenprotokol/hallucination-hunter/issues"
Changelog = "https://github.com/ramenprotokol/hallucination-hunter/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/hh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
